# fly.toml app configuration file generated for morss-rss-full on 2026-11-23T19:13:31Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'morss-rss-full'
primary_region = 'gru'

[build]

[env]
  PORT = '8080'
  # fetch full articles for up to MAX_ITEM items (default 5; the rest are
  # cache-only and dropped when not cached), within MAX_TIME seconds per
  # request; LIM_TIME is the hard limit after which remaining items are dropped
  MAX_ITEM = '10'
  MAX_TIME = '15'
  LIM_TIME = '25'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
