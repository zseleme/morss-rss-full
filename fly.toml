# fly.toml app configuration file generated for morss-rss-full on 2026-11-23T19:13:31Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'morss-rss-full'
primary_region = 'gru'

[build]

[env]
  PORT = '8080'
  # per request, items are handled in feed order:
  # - beyond LIM_ITEM items or after LIM_TIME seconds: dropped
  # - beyond MAX_ITEM items or after MAX_TIME seconds: full text only if
  #   already cached, otherwise dropped
  # - the rest: full text fetched
  # MAX_ITEM = LIM_ITEM, so the feed keeps 10 items, all fetched; only time
  # (15s soft, 25s hard) can make later ones cache-only or drop them
  MAX_ITEM = '10'
  LIM_ITEM = '10'
  MAX_TIME = '15'
  LIM_TIME = '25'
  # in-memory cache entries (feeds, pages, extracted articles): the 1000
  # default can outgrow the 256mb VM
  CACHE_SIZE = '300'
  # 4 threads in one worker: a slow feed (up to LIM_TIME) no longer blocks
  # every other request and the health check; threads keep the memory of a
  # single process (256mb VM) and share its in-memory cache
  GUNICORN_WORKERS = '1'
  GUNICORN_THREADS = '4'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
